name: Actualizar referentes desde Google Docs

# Se corre a mano: pestaña Actions → "Actualizar referentes desde Google Docs" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-referentes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer referentes nuevos del Doc
        run: python3 scripts/sync_referentes.py | tee salida.txt

      - name: Commit y push
        id: commit
        run: |
          git add contenido/referentes.md imagenes/referentes
          if git diff --cached --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "referentes: sincronizados desde Google Docs"
          git push
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Republicar GitHub Pages
        if: steps.commit.outputs.cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Resultado"
            echo '```'
            cat salida.txt 2>/dev/null || echo "(el script falló, revisa el paso anterior)"
            echo '```'
            if [ "${{ steps.commit.outputs.cambios }}" = "si" ]; then
              echo "Los cambios se publicarán en https://misaaaaaa.github.io/proyectoD/referentes.html en uno o dos minutos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
