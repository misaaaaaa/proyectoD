name: Actualizar contenido desde Google

# Se corre a mano: pestaña Actions → "Actualizar contenido desde Google" → Run workflow.
# Trae los referentes del Google Doc y las imágenes de ensayos de la carpeta de Drive.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'molibia/proyectoD' # solo en el repo principal, no en forks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install Pillow

      # Cada sync corre aunque el otro falle; lo que sí funcionó se publica igual.
      - name: Traer referentes nuevos del Doc
        id: referentes
        shell: bash # con pipefail: si el script falla, el paso falla
        run: python3 scripts/sync_referentes.py | tee referentes.txt

      - name: Traer imágenes de ensayos de la carpeta de Drive
        id: ensayos
        if: ${{ !cancelled() }}
        env:
          CARPETA_ID: ${{ secrets.CARPETA_ID }}
        shell: bash
        run: python3 scripts/sync_ensayos.py | tee ensayos.txt

      - name: Commit y push
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add -A contenido/referentes.md imagenes/referentes contenido/ensayos-imagenes.json imagenes/ensayos
          if git diff --cached --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "contenido: sincronizado desde Google (referentes y ensayos)"
          git push
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Republicar GitHub Pages
        if: ${{ !cancelled() && steps.commit.outputs.cambios == 'si' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Referentes (${{ steps.referentes.outcome }})"
            echo '```'
            cat referentes.txt 2>/dev/null || echo "(el script falló, revisa su paso)"
            echo '```'
            echo "## Ensayos (${{ steps.ensayos.outcome }})"
            echo '```'
            cat ensayos.txt 2>/dev/null || echo "(el script falló, revisa su paso)"
            echo '```'
            if [ "${{ steps.commit.outputs.cambios }}" = "si" ]; then
              echo "Los cambios se publicarán en https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ en uno o dos minutos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
