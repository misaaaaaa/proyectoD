name: Actualizar imágenes de ensayos desde Google Drive

# Corre solo todos los días, y también a mano:
# pestaña Actions → "Actualizar imágenes de ensayos desde Google Drive" → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 6:00 en Chile (hora de verano)

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-ensayos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Traer imágenes de la carpeta de Drive
        env:
          CARPETA_ID: ${{ secrets.CARPETA_ID }}
        shell: bash # con pipefail: si el script falla, el paso falla
        run: python3 scripts/sync_ensayos.py | tee salida.txt

      - name: Commit y push
        id: commit
        run: |
          git add -A contenido/ensayos-imagenes.json imagenes/ensayos
          if git diff --cached --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ensayos: imágenes sincronizadas desde Google Drive"
          git push
          echo "cambios=si" >> "$GITHUB_OUTPUT"

      - name: Republicar GitHub Pages
        if: steps.commit.outputs.cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Resultado"
            echo '```'
            cat salida.txt 2>/dev/null || echo "(el script falló, revisa el paso anterior)"
            echo '```'
            if [ "${{ steps.commit.outputs.cambios }}" = "si" ]; then
              echo "Los cambios se publicarán en https://misaaaaaa.github.io/proyectoD/ensayos.html en uno o dos minutos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
